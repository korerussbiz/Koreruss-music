<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koreruss Music – Download & Support</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; }
        .song { margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .donate { margin-top: 30px; padding: 20px; background: #f5f5f5; border-radius: 10px; text-align: center; }
        .solana-pay { display: inline-block; background: #9945FF; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        audio { width: 100%; margin-top: 8px; }
        a { color: #9945FF; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>🎵 Koreruss Music</h1>
    <p>Stream and download my tracks. If you enjoy the music, consider sending a tip via Solana Pay!</p>

    <div id="song-list">
        <!-- Songs will be listed here by JavaScript -->
    </div>

    <div class="donate">
        <h3>❤️ Support My Music</h3>
        <p>Send any amount of SOL to support my work:</p>
        <a class="solana-pay" href="solana:9vXyKbMr85Yaus38RQnjLjfxPWbCJVESbTmRH6JCWVE2?amount=0.01&label=Koreruss+Music+Support&message=Thanks+for+your+support!">Donate with Solana Pay</a>
    </div>

    <script>
        fetch('/music/list.json')
            .then(response => response.json())
            .then(files => {
                const list = document.getElementById('song-list');
                files.forEach(file => {
                    const div = document.createElement('div');
                    div.className = 'song';
                    div.innerHTML = `
                        <strong>${file.name}</strong>
                        <audio controls src="/music/${file.name}"></audio>
                        <br><a href="/music/${file.name}" download>Download</a>
                    `;
                    list.appendChild(div);
                });
            });

        document.querySelector('.solana-pay').href = 
            document.querySelector('.solana-pay').href.replace('9vXyKbMr85Yaus38RQnjLjfxPWbCJVESbTmRH6JCWVE2', '${9vXyKbMr85Yaus38RQnjLjfxPWbCJVESbTmRH6JCWVE2}');
    </script>
</body>
</html>
